[registry]
name = "Awal AI Components Registry"
description = "Shared AI components for common development stacks"

[stacks.go]
detect = ["go.mod", "go.sum"]

[stacks.flutter]
detect = ["pubspec.yaml"]

[stacks.swift]
detect = ["Package.swift", "*.xcodeproj", "*.xcworkspace"]

[stacks.python]
detect = ["pyproject.toml", "setup.py", "requirements.txt"]

[stacks.csharp]
detect = ["*.csproj", "*.sln"]

[stacks.rust]
detect = ["Cargo.toml"]

[stacks.node]
detect = ["package.json"]

[stacks.java]
detect = ["pom.xml", "build.gradle", "build.gradle.kts"]

[stacks.kotlin]
detect = ["build.gradle.kts", "*.kt"]

[stacks.php]
detect = ["composer.json", "artisan"]

[stacks.ruby]
detect = ["Gemfile", "*.gemspec", "Rakefile"]

[stacks.zig]
detect = ["build.zig"]

[stacks.elixir]
detect = ["mix.exs"]

[stacks.cpp]
detect = ["CMakeLists.txt"]
