[registry]
name = "Awal AI Components Registry"
description = "Production-quality AI components for 35 development stacks"

# ╔══════════════════════════════════════════════╗
# ║  Tier 1 — Deeply detailed (most nuance)      ║
# ╚══════════════════════════════════════════════╝

[stacks.swift]
detect = ["Package.swift", "*.xcodeproj", "*.xcworkspace"]

[stacks.rust]
detect = ["Cargo.toml"]

[stacks.go]
detect = ["go.mod", "go.sum"]

[stacks.python]
detect = ["pyproject.toml", "setup.py", "requirements.txt", "uv.lock"]

[stacks.typescript]
detect = ["tsconfig.json"]

[stacks.java]
detect = ["pom.xml", "build.gradle", "build.gradle.kts"]

[stacks.kotlin]
detect = ["build.gradle.kts", "*.kt"]

[stacks.dart]
detect = ["pubspec.yaml", "*.dart"]

# ╔══════════════════════════════════════════════╗
# ║  Tier 2 — Solid coverage                     ║
# ╚══════════════════════════════════════════════╝

[stacks.php]
detect = ["composer.json", "artisan"]

[stacks.ruby]
detect = ["Gemfile", "*.gemspec", "Rakefile"]

[stacks.csharp]
detect = ["*.csproj", "*.sln"]

[stacks.cpp]
detect = ["CMakeLists.txt", "*.cpp", "*.hpp"]

[stacks.scala]
detect = ["build.sbt", "*.scala"]

[stacks.elixir]
detect = ["mix.exs"]

[stacks.zig]
detect = ["build.zig"]

# ╔══════════════════════════════════════════════╗
# ║  Tier 3 — Essential patterns                 ║
# ╚══════════════════════════════════════════════╝

[stacks.haskell]
detect = ["*.cabal", "stack.yaml", "cabal.project"]

[stacks.clojure]
detect = ["project.clj", "deps.edn"]

[stacks.ocaml]
detect = ["dune-project", "*.opam"]

[stacks.fsharp]
detect = ["*.fsproj", "*.fsx"]

[stacks.r]
detect = ["DESCRIPTION", "*.Rproj"]

[stacks.julia]
detect = ["Project.toml", "*.jl"]

[stacks.perl]
detect = ["cpanfile", "Makefile.PL", "dist.ini"]

[stacks.lua]
detect = ["*.rockspec", ".luacheckrc"]

[stacks.objc]
detect = ["*.m", "*.mm", "Podfile"]

[stacks.shell]
detect = ["*.sh", "*.bash", ".shellcheckrc"]

# ╔══════════════════════════════════════════════╗
# ║  Frameworks                                   ║
# ╚══════════════════════════════════════════════╝

[stacks.flutter]
detect = ["pubspec.yaml"]

[stacks.svelte]
detect = ["svelte.config.js", "*.svelte"]

[stacks.vue]
detect = ["vue.config.js", "*.vue", "nuxt.config.ts"]

[stacks.angular]
detect = ["angular.json", "ng-package.json"]

[stacks.react-native]
detect = ["metro.config.js", "app.json"]

[stacks.node]
detect = ["package.json"]

# ╔══════════════════════════════════════════════╗
# ║  DevOps / Infrastructure                      ║
# ╚══════════════════════════════════════════════╝

[stacks.terraform]
detect = ["*.tf", "*.tfvars"]

[stacks.docker]
detect = ["Dockerfile", "docker-compose.yml", "compose.yaml"]

[stacks.ansible]
detect = ["ansible.cfg", "playbook.yml", "roles/"]

[stacks.kubernetes]
detect = ["kustomization.yaml", "helmfile.yaml", "Chart.yaml"]
